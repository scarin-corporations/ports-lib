name: Catalog and site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    outputs:
      pages_configured: ${{ steps.page_status.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'refs/heads/main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
        id: pages
        if: github.event_name != 'pull_request'
        with:
          enablement: false
        continue-on-error: true
      - name: Record Pages readiness
        id: page_status
        if: steps.pages.outcome == 'success'
        run: echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Report Pages setup requirement
        if: github.event_name != 'pull_request' && steps.pages.outcome != 'success'
        run: echo 'Pages is not enabled or cannot be configured by GITHUB_TOKEN. Enable Settings > Pages > Build and deployment > GitHub Actions as an organization owner.'
      - run: python -m unittest discover -s tests -v
      - name: Refresh GitHub metadata
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync.py
      - name: Refresh README chart and ranking
        if: github.event_name != 'pull_request'
        run: python scripts/update_readme.py
      - name: Review mapped game projects
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/review_agent.py
      - name: Persist successful observations
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git add data/catalog.json data/games.json data/review-report.json data/top-stars.svg README.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: refresh catalog'
            git push
          fi
      - run: mkdir -p dist/web dist/data && cp web/* dist/web/ && cp data/catalog.json data/games.json data/review-report.json dist/data/ && cp index.html dist/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.pages_configured == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
